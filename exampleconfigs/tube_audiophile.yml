---
# Example configuration showing the new TubeStage filter, which simulates an
# audiophile single-ended-triode amplifier (e.g. 300B). Two models are
# available, both running through an oversampling stage to suppress aliasing
# of the harmonics generated by the non-linear waveshaping:
#
#   - Polynomial: asymmetric polynomial waveshaper (k2 dominates k3) plus a
#     gentle "transformer" high-frequency shelf and DC blocker. Lightweight
#     and easy to tune.
#   - Triode:    Koren plate-current model with input/output coupling caps,
#     cathode bypass and supply sag. Heavier on CPU.
#
# Latency note: when oversampling is enabled, each TubeStage instance adds
# roughly 15 / factor low-rate samples of group delay per cascaded halfband
# stage (Kaiser-windowed, length 31). At 44.1 kHz with factor=4 (2 stages),
# that is about 11 samples ~= 0.25 ms per filter. The Rubato FFT backend has
# higher latency (typically 2 chunks) and is intended for low-CPU offline
# usage rather than minimum latency.

devices:
  samplerate: 48000
  chunksize: 1024
  resampler: null
  capture:
    type: Stdin
    channels: 2
    format: S16_LE
  playback:
    type: Stdout
    channels: 2
    format: S16_LE

filters:
  # Quick "audiophile color" pack: even-harmonic emphasis, low CPU.
  tube_color:
    type: TubeStage
    parameters:
      model:
        type: Polynomial
        drive_db: 6.0
        bias: 0.05            # asymmetry -> even harmonics (warmth)
        k2: 0.15
        k3: 0.02
        k4: 0.0
      transformer:
        enabled: true
        hf_shelf_freq: 8000.0
        hf_shelf_gain_db: -1.5
      dc_blocker: true
      makeup_gain_db: -3.0
      oversampling:
        factor: "4"
        backend: HalfbandFir

  # Physical 300B-style triode model. Uses the Koren equation with the
  # default 300B coefficients (Yeh thesis Tab. 3.2). Slightly more CPU.
  tube_300b:
    type: TubeStage
    parameters:
      model:
        type: Triode
        # All triode parameters are optional; defaults match a 300B.
        # mu: 3.85
        # kp: 4.5
        # kvb: 140.0
        # kg1: 1500.0
        # x: 1.4
        # vbias: -60.0
        # vplate: 300.0
        drive_db: 0.0
        cathode_bypass_freq: 50.0
        coupling_freq_in: 10.0
        coupling_freq_out: 10.0
        sag_amount: 0.05
      transformer:
        enabled: true
        hf_shelf_freq: 7000.0
        hf_shelf_gain_db: -2.0
      dc_blocker: true
      makeup_gain_db: 0.0
      oversampling:
        factor: "8"
        backend: HalfbandFir

pipeline:
  # Use either of the two filters defined above. The "tube_color" pack is
  # the lighter polynomial waveshaper; "tube_300b" runs the physical Koren
  # model with 8x oversampling.
  - type: Filter
    channels: [0, 1]
    names:
      - tube_color
  # - type: Filter
  #   channels: [0, 1]
  #   names:
  #     - tube_300b
